name: Deploy game to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["src/**", "client/**", "docs/config.js", "build.py", "patches.py", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Build (src/game.html + 온라인 레이어 -> docs/)
        run: python3 build.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: d
        uses: actions/deploy-pages@v4
